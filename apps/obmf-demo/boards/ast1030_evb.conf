CONFIG_WATCHDOG=y
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_GPIO_ASPEED_SGPIOM=y

CONFIG_SPI=y
CONFIG_SPI_ASPEED=y
CONFIG_SPI_NOR=n
CONFIG_SPI_NOR_MULTI_DEV=y
CONFIG_SPI_DMA_SUPPORT_ASPEED=y

CONFIG_FLASH=y
CONFIG_FLASH_JESD216_API=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SHELL=y

CONFIG_I2C=y
CONFIG_I2C_ASPEED=y
CONFIG_I2C_TARGET=y


CONFIG_USB_CDC_ACM=n
# For the NVIDIA OBMF USB host driver
CONFIG_USB_DEVICE_VID=0x0955
CONFIG_USB_DEVICE_PID=0xcf11
CONFIG_USB_DEVICE_MANUFACTURER="ASPEED"
CONFIG_USB_DEVICE_PRODUCT="OBMF-USB"
CONFIG_USB_DEVICE_SN="55661030"
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_REQUEST_BUFFER_SIZE=4096
# CONFIG_USB_DEVICE_LOG_LEVEL_OFF=y

CONFIG_I3C=y
CONFIG_I3C_TARGET=y
CONFIG_I3C_IBI_WORKQUEUE=y
CONFIG_I3C_SHELL=y
CONFIG_SHELL_GETOPT=y


CONFIG_MBEDTLS=n
CONFIG_MBEDTLS_SHA384=n
CONFIG_UART_ASPEED=y


CONFIG_JTAG=y
CONFIG_JTAG_ASPEED=y

CONFIG_USB_WORKQUEUE=y
