CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# CONFIG_LOG_DEFAULT_LEVEL=4

# USB configuration
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="LSTP OBMF Demo"
CONFIG_USB_DEVICE_VID=0x1ab4
CONFIG_USB_DEVICE_PID=0x0001
# Use same max EP buffer size as mctp-demo if 512 is supported, or fallback to 64 if HS is not enabled
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=99
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_TIMEOUT=-1
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=1024

# I2C support for LSTP I2C channel
CONFIG_I2C=y
