# I3C controller in target (secondary) mode
CONFIG_I3C=y
CONFIG_I3C_ASPEED=y
CONFIG_I3C_USE_IBI=y
CONFIG_I3C_IBI_WORKQUEUE=y

# I3C target message queue
CONFIG_I3C_TARGET=y
CONFIG_I3C_TARGET_MQUEUE=y
# i3c_target_mqueue uses crc8_ccitt() for the IBI PEC byte
CONFIG_CRC=y

# libmctp binding over the i3c0 target mqueue
CONFIG_MCTP_I3C_TARGET_MQUEUE=y

# USB device controller on the new USB device stack, for MCTP over USB.
# Builds udc_aspeed; the legacy usb_dc_aspeed driver is excluded by this.
CONFIG_USB_DEVICE_STACK_NEXT=y
# Warnings only: the info level logs every control transfer of enumeration
CONFIG_USBD_LOG_LEVEL_WRN=y
# UDC events off the system workqueue, where mctp_usb blocks on multi-packet tx
CONFIG_UDC_WORKQUEUE=y
CONFIG_UDC_WORKQUEUE_STACK_SIZE=1024
# libmctp binding for MCTP over USB (DSP0283)
CONFIG_MCTP_USB=y

# Boot SPI flash (fmc_cs0), where CONFIG_MCTP_EVAL_PLDM_FLASH programs updates
CONFIG_SPI=y
CONFIG_SPI_ASPEED=y
CONFIG_SPI_NOR=n
CONFIG_SPI_NOR_MULTI_DEV=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Reboot (shell "kernel reboot", sys_reboot()), a chip reset by watchdog wdt1;
# a cold reboot reloads the image from the boot flash
CONFIG_WATCHDOG=y
CONFIG_WDT_ASPEED=y
CONFIG_REBOOT=y
# PLDM updates go to the sink. The SoC boots fmc_cs0 offset 0 without
# authenticating it, so to program updates there and boot them, any MCTP peer
# being able to replace the firmware, set:
# CONFIG_MCTP_EVAL_PLDM_FLASH=y
# CONFIG_MCTP_EVAL_PLDM_REBOOT=y
