# I3C controller in target (secondary) mode
CONFIG_I3C=y
CONFIG_I3C_USE_IBI=y
CONFIG_I3C_IBI_WORKQUEUE=y
CONFIG_I3C_MIPI_HCI=y
CONFIG_I3C_MIPI_HCI_PIO=y
CONFIG_I3C_MIPI_HCI_DMA=y
CONFIG_I3C_MIPI_HCI_TARGET=y
CONFIG_I3C_MIPI_HCI_ASPEED_VENDOR=y
# Target receive pool, 4-byte chunks: 1023 holds ~56 back-to-back 69-byte
# MCTP packets. The default 128 (512 bytes) overflows after ~8 packets of a
# multi-packet message at 12.5 MHz and corrupts them.
CONFIG_I3C_MIPI_HCI_DMA_IBI_CHUNKS=1023

# I3C target message queue
CONFIG_I3C_TARGET=y
CONFIG_I3C_TARGET_MQUEUE=y
# i3c_target_mqueue uses crc8_ccitt() for the IBI PEC byte
CONFIG_CRC=y

# libmctp binding over the i3c0 target mqueue
CONFIG_MCTP_I3C_TARGET_MQUEUE=y

# USB device controller (udc0) on the new USB device stack, for MCTP over USB.
# Builds udc_aspeed; the legacy usb_dc_aspeed driver is excluded by this.
CONFIG_USB_DEVICE_STACK_NEXT=y
# Warnings only: the info level logs every control transfer of enumeration
CONFIG_USBD_LOG_LEVEL_WRN=y
# UDC events off the system workqueue, where mctp_usb blocks on multi-packet tx
CONFIG_UDC_WORKQUEUE=y
CONFIG_UDC_WORKQUEUE_STACK_SIZE=1024
# libmctp binding for MCTP over USB (DSP0283)
CONFIG_MCTP_USB=y

# Reboot (shell "kernel reboot", sys_reboot()), a reset by watchdog wdt0; cold
# is a full chip reset, so the whole boot chain runs again
CONFIG_WATCHDOG=y
CONFIG_WDT_ASPEED=y
CONFIG_REBOOT=y
# Program PLDM updates into the boot bundle partition, which the next boot
# authenticates, and boot them as soon as they are activated
CONFIG_MCTP_EVAL_PLDM_FLASH=y
CONFIG_MCTP_EVAL_PLDM_REBOOT=y

# Board peripherals this app doesn't use, to keep the 256 KiB code region in
# budget. SPI/flash stay: the SPI monitor guards the BMC and host flashes.
CONFIG_SENSOR=n
CONFIG_PWM=n
CONFIG_PECI=n
CONFIG_ADC=n
