# SYSTEM
# USB receive runs on the system workqueue: the binding's parser, libmctp, the
# app's rx callback and the reply's transmit, nested (1024 bytes was 82% used)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# i3c-target-mqueue and the I3C DMA receive pool allocate from the system heap;
# libmctp has its own heap (CONFIG_MCTP_HEAP_SIZE)
CONFIG_HEAP_MEM_POOL_SIZE=32768

# LOGGING
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192

# SHELL
CONFIG_SHELL=y

# MCTP (libmctp); answers control requests such as Set Endpoint ID
CONFIG_MCTP=y
# Two libmctp instances (I3C, USB) share this heap
CONFIG_MCTP_HEAP_SIZE=8192
CONFIG_LIBMCTP_CONTROL_HANDLER_ENABLED=y
