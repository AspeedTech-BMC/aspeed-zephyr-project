CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_THREAD_INFO=y
# CONFIG_STACK_SENTINEL=y
CONFIG_MEM_ATTR=y
CONFIG_MULTI_HEAP=y
CONFIG_SHARED_MULTI_HEAP=y
# CONFIG_STACK_CANARIES=y
CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=32768
# CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=99
# CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_TIMEOUT=-1
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=8192
CONFIG_SHELL_ARGC_MAX=70

CONFIG_SERIAL_INIT_PRIORITY=45
CONFIG_CONSOLE_INIT_PRIORITY=45
CONFIG_LOG=y
# CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192

CONFIG_SMF=y
# CONFIG_MINIMAL_LIBC=y

CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=524288
CONFIG_SYS_HEAP_INFO=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_SHA384=y
CONFIG_MBEDTLS_SHA512=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_DP_SECP384R1_ENABLED=y
CONFIG_MBEDTLS_ECP_NIST_OPTIM=y
CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="mbedtls_config.h"

CONFIG_SPDM_RESPONDER=y
CONFIG_DMTF_LIBSPDM=y
CONFIG_DMTF_LIBSPDM_CONFIG_FILE="libspdm_config.h"
CONFIG_DMTF_LIBSPDM_OS_STUB_CRYPTLIB_NULL=y
# CONFIG_DMTF_LIBSPDM_OS_STUB_CRYPTLIB_MBEDTLS=y

CONFIG_PLDM=y
CONFIG_PLDM_BASE=y
CONFIG_PLDM_FW_UPDATE=y
CONFIG_PLDM_OEM=y
