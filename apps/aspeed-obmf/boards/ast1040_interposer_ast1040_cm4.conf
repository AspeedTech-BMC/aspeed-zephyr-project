CONFIG_WATCHDOG=y
CONFIG_DYNAMIC_INTERRUPTS=y

CONFIG_ESPI=y
CONFIG_SNOOP_ASPEED=y
CONFIG_ESPI_ASPEED_V2=y
CONFIG_ESPI_PERIPHERAL_CHANNEL=y
CONFIG_ESPI_VWIRE_CHANNEL=y
CONFIG_ESPI_OOB_CHANNEL=y
CONFIG_ESPI_OOB_CHANNEL_RX_ASYNC=y
CONFIG_ESPI_FLASH_CHANNEL=y
CONFIG_ESPI_TAF=y

CONFIG_SPI=y
CONFIG_SPI_ASPEED=y
CONFIG_SPI_NOR=n
CONFIG_SPI_DMA_SUPPORT_ASPEED=y

CONFIG_FLASH=y
CONFIG_FLASH_JESD216_API=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SHELL=y

CONFIG_I2C=y
CONFIG_I2C_ASPEED=y
CONFIG_I2C_TARGET=y


CONFIG_USB_CDC_ACM=n
# For the NVIDIA OBMF USB host driver
CONFIG_USB_DEVICE_VID=0x0955
CONFIG_USB_DEVICE_PID=0xcf11
CONFIG_USB_DEVICE_MANUFACTURER="ASPEED"
CONFIG_USB_DEVICE_PRODUCT="OBMF-USB"
CONFIG_USB_DEVICE_SN="55661040"
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_REQUEST_BUFFER_SIZE=4096
# CONFIG_USB_DEVICE_LOG_LEVEL_OFF=y

# The interposer exports only the UART (host VUART), MMIO and IPMI channels.
CONFIG_OBMF_LSTP_SPI_CHANNEL=n
CONFIG_OBMF_LSTP_I2C_CHANNEL=n
CONFIG_OBMF_LSTP_GPIO_CHANNEL=n

CONFIG_UART_ASPEED=y
CONFIG_UART_NS16550_ACCESS_WORD_ONLY=y
CONFIG_OBMF_ESPI_UART_VUART=y
CONFIG_OBMF_ESPI_IPMI=y
# The BMC loads the host's SAFS flash image over MMIO on this board.
CONFIG_OBMF_ESPI_MMIO_SAFS_WRITE=y

CONFIG_SHELL_PROMPT_UART="ast1040-interposer:~$ "

CONFIG_USB_WORKQUEUE=y

# The eSPI driver logs one line per peripheral-channel interrupt. During an MMBI
# transfer that is one line per memory cycle, which drowns the bridge's own
# traces and trips the log backend's drop path.
CONFIG_ESPI_LOG_LEVEL_WRN=y

# The overlay disables &pwm and &tach; drop their drivers too.
CONFIG_PWM_ASPEED=n
CONFIG_TACH_ASPEED=n
