CONFIG_WATCHDOG=y
CONFIG_DYNAMIC_INTERRUPTS=y

CONFIG_SPI=y
CONFIG_SPI_ASPEED=y
CONFIG_SPI_NOR=n
CONFIG_SPI_NOR_MULTI_DEV=y
CONFIG_SPI_DMA_SUPPORT_ASPEED=y

CONFIG_FLASH=y
CONFIG_FLASH_JESD216_API=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

CONFIG_I2C=y
CONFIG_I2C_ASPEED=y
CONFIG_I2C_TARGET=y


CONFIG_USB_CDC_ACM=n
# For the NVIDIA OBMF USB host driver
CONFIG_USB_DEVICE_VID=0x0955
CONFIG_USB_DEVICE_PID=0xcf11
CONFIG_USB_DEVICE_MANUFACTURER="ASPEED"
CONFIG_USB_DEVICE_PRODUCT="OBMF-USB"
CONFIG_USB_DEVICE_SN="55661040"
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_REQUEST_BUFFER_SIZE=4096
# CONFIG_USB_DEVICE_LOG_LEVEL_OFF=y

# The EVB has no host eSPI link, so it
# exports SPI, I2C and GPIO, and its UART channel drives uart0 (CON5).
CONFIG_OBMF_LSTP_SPI_CHANNEL=y
CONFIG_OBMF_LSTP_I2C_CHANNEL=y
CONFIG_OBMF_LSTP_GPIO_CHANNEL=y
CONFIG_UART_ASPEED=y

CONFIG_UART_NS16550_ACCESS_WORD_ONLY=y

CONFIG_SHELL_PROMPT_UART="ast1040-evb:~$ "

CONFIG_USB_WORKQUEUE=y

# The overlay disables &pwm and &tach; drop their drivers too.
CONFIG_PWM_ASPEED=n
CONFIG_TACH_ASPEED=n
