description: ASPEED OBMF LSTP backend topology

compatible: "aspeed,obmf-lstp"

include: base.yaml

properties:
# The core and UART are always built. Other channel directories are built when
# their Kconfig option is set.
# lstp/lstp_backend.h checks fields required by the enabled backends.
  i2c-controller:
    type: phandle
    description: |
      I2C controller exported by the LSTP I2C channel. Required with
      CONFIG_OBMF_LSTP_I2C_CHANNEL.

  spi-devices:
    type: phandles
    description: |
      The one SPI flash exported as LSTP chip-select 0; list exactly one
      phandle. Required with CONFIG_OBMF_LSTP_SPI_CHANNEL.

  gpio-controllers:
    type: phandles
    description: |
      GPIO banks ordered by the LSTP logical GPIO index. Required with
      CONFIG_OBMF_LSTP_GPIO_CHANNEL.

  uart-controller:
    type: phandle
    description: |
      UART device exported by the LSTP UART channel: the hardware VUART with
      CONFIG_OBMF_ESPI_UART_VUART, otherwise a plain UART. Not needed when
      CONFIG_OBMF_LSTP_UART_SHELL backs the channel with shell commands.

  spi-channel-name:
    type: string
    default: "SPI"

  i2c-channel-name:
    type: string
    default: "I2C"

  uart-channel-name:
    type: string
    default: "UART"

  espi-controller:
    type: phandle
    description: eSPI controller used by the AST1040 bridge. Required with
      CONFIG_OBMF_ESPI_BRIDGE.

  snoop-controller:
    type: phandle
    description: eSPI snoop controller used by the AST1040 bridge. Required
      with CONFIG_OBMF_ESPI_BRIDGE.

  gpio-input-lines:
    type: array
    description: |
      LSTP GPIO indices reported to the BMC as inputs that can take an IRQ
      configuration. They are made inputs at init.

  gpio-output-lines:
    type: array
    description: |
      LSTP GPIO indices the BMC may drive. This is an allow-list: the
      gpio-controllers banks export whole 32-pin ports, and a pin left off
      this list (a pinmuxed UART/I2C pin, a strap, a reset or power enable)
      is reported as an input and SetValue on it is rejected. A pin on neither
      list is never reconfigured; gpio-input-lines pins are made inputs at init.
      A pin must not be in both lists.

  vwire-gpio-base:
    type: int
    default: 0
    description: First logical GPIO index reserved for eSPI virtual wires

  vwire-gpio-count:
    type: int
    default: 0
    description: Number of eSPI virtual wires appended to the GPIO channel
