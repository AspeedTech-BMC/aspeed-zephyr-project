CONFIG_LOG=y
# CONFIG_LOG_MODE_IMMEDIATE=y
# CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_UART_CONSOLE_DEBUG_SERVER_HOOKS=y

# USB configuration
CONFIG_USB_DEVICE_STACK=y
# The IDs the NVIDIA OBMF/LSTP host driver binds to.
CONFIG_USB_DEVICE_MANUFACTURER="ASPEED"
CONFIG_USB_DEVICE_PRODUCT="OBMF-USB"
CONFIG_USB_DEVICE_VID=0x0955
CONFIG_USB_DEVICE_PID=0xcf11
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="ast1030-evb:~$ "
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=99
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_TIMEOUT=-1
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=1024
CONFIG_KERNEL_SHELL=y
# "select obmf <group>" makes a subtree the root, so a debug session types the leaf
# names only; alt+r returns to the top.
CONFIG_SHELL_CMDS_SELECT=y
CONFIG_REBOOT=y

# I2C support for the OBMF I2C channel
CONFIG_I2C=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Every UART channel backend buffers through a ring_buf; the shell used to
# pull this in implicitly.
CONFIG_RING_BUFFER=y
