# AST1080 (AST10x0-G2) uses the g7 GPIO/SGPIOM drivers, auto-enabled via DT.

# TODO (AST1080 HW bring-up): AST1080 (G2) does not expose the AST10x0-style
# HACE / RSA / ECDSA crypto engines or the TRNG on the CM4. Disable the
# AST10x0 hardware-crypto/entropy drivers (forced on in the shared prj.conf)
# so the build falls back to the mbedTLS software paths for what Caliptra
# doesn't cover yet.
CONFIG_CRYPTO_ASPEED=n
CONFIG_RSA_ASPEED=n
CONFIG_ECDSA_ASPEED=n
CONFIG_ENTROPY_ASPEED_TRNG=n

# AST1080 SPIM driver never populates log_max_sz/log_ram_addr (RAM log is
# an AST1060-only feature), so spim_get_log_info() always fails here.
# Disable the log buffer/IRQ install entirely instead of hitting that
# error on every SPIM interrupt.
CONFIG_ASPEED_SPIM_LOG_SIZE=0

# Caliptra-SS MCI mailbox: hash goes through the HW SHA engine
# (HROT_HASH_BACKEND_CPTRA). ECDSA-P384 verify stays on mbedTLS software -
# the CM_ECDSA_CMK_* commands operate on an imported/derived Cmk handle, not
# a raw public key, so they aren't a drop-in replacement for
# pfr_wrapper's verify-with-raw-pubkey call yet.
CONFIG_CPTRA_MCI_MBOX=y
CONFIG_CPTRA_MCI_MISC=y
CONFIG_CPTRA_MCI_SHA=y
CONFIG_CPTRA_MCI_CRYPTOGRAPHIC_MBOX=y
CONFIG_CPTRA_MCI_SHELL=y
CONFIG_HROT_HASH_BACKEND_CPTRA=y
CONFIG_PFR_ECDSA_P384_BACKEND_MBEDTLS=y

# AST1080 currently uses software crypto on the CM4, so prefer -O2 over the
# Zephyr default -Os to avoid unnecessarily reducing SHA/ECDSA throughput.
CONFIG_SPEED_OPTIMIZATIONS=y

# The whole PFR boot flow (AspeedStateMachine, incl. active/recovery image
# verification) runs on the main thread with no dedicated task. mbedTLS's
# software ECDSA-P384/SHA-384 verify path (forced above, no HW crypto on G2)
# is stack-heavy - the shared prj.conf's 16384 overflows here (confirmed via
# a real crash: SP/PC landed right at z_main_stack's top edge, spilling into
# kheap__system_heap). Boards with HW crypto keep the call stack shallow and
# don't need this.
CONFIG_MAIN_STACK_SIZE=32768

# AST1080 has 12.5MB of RAM vs the shared prj.conf's 16KB heap - bump it so
# the mbedtls_perf shell command (TestShell.c) can k_malloc large buffers to
# benchmark mbedTLS software crypto throughput.
CONFIG_HEAP_MEM_POOL_SIZE=8388608

# TODO(AST1080): no HW TRNG on the CM4 yet. Use the software PRNG so the random
# subsystem (sys_rand_get) links. NOT cryptographically secure - replace with a
# real entropy source (Caliptra TRNG) for production.
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_SPI_MONITOR_ASPEED=y

CONFIG_SPI_ASPEED=y
CONFIG_SPI_NOR_ADDR_MODE_FALLBACK_DISABLED=y

CONFIG_SPI_DMA_SUPPORT_ASPEED=y
CONFIG_I2C_ASPEED=y

# I2C_PFR/I2C_PFR_FILTER/PFR_SW_MAILBOX/I2C_SWMBX_TARGET are hard compile-time
# deps of the aspeed-pfr app (Smbus_mailbox.c / intel_pfr_spi_filtering.c call
# swmbx_*/ast_i2c_filter_* unconditionally, no #ifdef guard) - confirmed by a
# real build: disabling CONFIG_I2C_PFR drops the whole drivers/i2c/pfr/
# subdirectory and the link fails with undefined swmbx_read/write/etc. Not
# board-specific HW drivers, so left enabled.
CONFIG_I2C_PFR=y
CONFIG_I2C_PFR_INIT_PRIORITY=60
CONFIG_I2C_PFR_FILTER=y
CONFIG_PFR_SW_MAILBOX=y
CONFIG_I2C_SWMBX_TARGET=y

# TODO(AST1080 HW bring-up): abr_aspeed driver not ready for the G2 register
# map yet. Disable it (src/pfr/abr_stub.c supplies no-op stand-ins so the app's
# unconditional get_boot_indicator/disable_abr_wdt/clear_abr_indicator calls
# still link). Re-enable once the AST1080 ABR driver is ready.
CONFIG_ABR_FLOW_CTRL_ASPEED=n

# TODO(AST1080 BSP): temporarily disabled to align dcscm with the evb board,
# which does not enable any of these. Re-enable once the AST1080 BSP
# (WDT/DC-SCM drivers) is ready and the boot hang is isolated.
CONFIG_WATCHDOG=y
CONFIG_WDT_ASPEED=y
CONFIG_ASPEED_DC_SCM=n
CONFIG_PLATFORM_STATE_LED=n
CONFIG_BMC_STAGING_SIZE=0x3de0000
CONFIG_BMC_PFR_STAGING_SIZE=0x100000
CONFIG_BMC_CPLD_STAGING_SIZE=0x400000
CONFIG_PCH_STAGING_SIZE=0x1400000
CONFIG_PIT_PROTECTION=y

CONFIG_INTEL_PFR=y

# Intel PFR 3.0
CONFIG_SEAMLESS_UPDATE=y
CONFIG_CERBERUS_MCTP=y
CONFIG_CERBERUS_MCTP_TEST_ECHO=n
CONFIG_PFR_MCTP=y

# AFM attestation disabled for now on AST1080.
# CONFIG_PFR_SPDM_RESPONDER stays on: mctp_interface.c (built whenever
# CONFIG_PFR_MCTP=y) calls into the SPDM responder unconditionally, so it
# must remain enabled or the link fails (same combo as ast1060_dcscm_dice).
CONFIG_PFR_SPDM_ATTESTATION=n
CONFIG_PFR_SPDM_RESPONDER=y

# Intel PFR 4.0
# MCTP over I3C (AST1080 uses the g7 MIPI-HCI I3C controller)
# Disabled along with AFM/SPDM attestation above
CONFIG_I3C=y
CONFIG_I3C_MIPI_HCI=y
CONFIG_I3C_MIPI_HCI_PIO=y
CONFIG_I3C_MIPI_HCI_DMA=y
CONFIG_I3C_DUMMY_DEVICE=y
# CONFIG_I3C_MIPI_HCI_TARGET=y
# CONFIG_I3C_MIPI_HCI_ASPEED_VENDOR=y
CONFIG_PFR_MCTP_I3C=y
CONFIG_I3C_IBI_WORKQUEUE=y
CONFIG_I3C_USE_IBI=y

# CPLD Update
#CONFIG_INTEL_PFR_CPLD_UPDATE=y
#CONFIG_INTEL_SCM_CPLD_UPDATE_ONLY=y

# Provision debug
CONFIG_PROVISION_SHELL=y

# AFM version settings (unused while AFM/SPDM attestation is disabled above)
#CONFIG_AFM_SPEC_VERSION=4
#CONFIG_PFR_SPDM_ATTESTATION_MAX_DEVICES=33

# Intel PFR 5.0 (OKS uses PFR 5.0, unlike BHS which stays PFR 4.0)
# Disabled along with AFM/SPDM attestation above
CONFIG_PFR_MCTP_I3C_5_0=y
CONFIG_I3C_TARGET=y
CONFIG_I3C_TARGET_MQUEUE=y
CONFIG_SECURE_CONNECTION_RESPONDER=n
CONFIG_SECURE_CONNECTION_REQUESTER=n
CONFIG_SECURE_LOCK_MODE=2

# TODO (AST1080 HW bring-up): dual-flash (CPU_DUAL_FLASH) is not enabled yet.
